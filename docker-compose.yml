services:
  app:
    image: php:8.3-cli
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "docker-php-ext-install pdo_mysql > /dev/null 2>&1 || true; php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: eduquiz
      MYSQL_USER: eduquiz
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      retries: 10

  node:
    image: node:22
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"

volumes:
  dbdata:
